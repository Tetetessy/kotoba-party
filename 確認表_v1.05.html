<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ことばパーティ 確認表</title>
<style>
:root{
  /* 構成：縦に一列の確認表。見出し・番号・チェック欄の3つだけ */
  --bg:#fbf8f2;--fg:#2b2620;--muted:#7a7166;--line:#e6dfd2;--accent:#c2552d;--card:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1c1915;--fg:#f1ebe0;--muted:#a79d8e;--line:#3a342c;--accent:#f08a5d;--card:#26221c;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1c1915;--fg:#f1ebe0;--muted:#a79d8e;--line:#3a342c;--accent:#f08a5d;--card:#26221c;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
main{max-width:640px;margin:0 auto;min-width:0}
h1{font-size:1.35rem;margin:4px 0 2px;text-wrap:balance}
.lead{color:var(--muted);font-size:.95rem;margin:0 0 16px}
.link{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:700;margin:4px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:14px}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--accent)}
.step b{display:block}
.step small{color:var(--muted);display:block;margin-top:2px;overflow-wrap:anywhere}
.done b{text-decoration:line-through;color:var(--muted)}
h2{font-size:1rem;color:var(--accent);margin:22px 0 8px}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>ことばパーティ v1.05 確認表</h1>
<p class="lead">v1.05の変更を順番に確認する表です。チェックは、このブラウザにだけ残ります。</p>
<a class="link" href="https://tetetessy.github.io/kotoba-party/" target="_blank" rel="noopener">アプリを開く</a>

<h2>変更点の確認</h2>
<div class="card" id="g2"></div>
<h2>問題の確認</h2>
<div class="card" id="g3"></div>
<h2>最後に</h2>
<div class="card" id="g4"></div>
<button class="reset" id="rs" type="button">チェックをすべて外す</button>
</main>
<script>
const G=[
 ['g2',[
  ['称号コレクションが3列にそろっている','ホーム → 称号コレクション。最後の行にも空きマスがあり、はみ出していない'],
  ['基本単語の4択が「似た形」になっている','スペイン語を選び、基本単語を解く。例：「私」の答えが yo のとき、mi や me が選択肢に並ぶ（男性形・女性形の取り違えを狙う）'],
  ['スペイン語・イタリア語以外は従来どおり','英語・韓国語などで基本単語を解いても、おかしな選択肢が出ない'],
 ]],
 ['g3',[
  ['基本の文章に「空白に入る言葉」の問題が出る','スペイン語で基本の文章を解く。「＿＿＿」の入った問題が、10問に4問ほどの割合で出る'],
  ['空白の問題の選択肢が自然に読める','選択肢の言葉を入れると、文として正しく読める（ダミーも近い形の言葉）'],
  ['全文を選ぶ問題も出る','空白のない文章の4択も、これまで通り出る'],
  ['空白の問題で正解・不正解の表示が出る','正解の文と訳が下に表示され、「つぎへ」で次に進める'],
 ]],
 ['g4',[
  ['再読み込み後も続きから解ける','問題の途中で再読み込みし、同じ問題が出るか確認'],
  ['おかしなところがあれば、意見箱（Googleフォーム）から送る','アプリの⚙オプション内の「意見箱を開く」から。メールアドレスは書かない'],
 ]],
];
const KEY='kp_check_v105';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let n=0;
for(const [gid,items] of G){
  const box=document.getElementById(gid);
  for(const [t,d] of items){
    n++;const id='c'+n;
    const row=document.createElement('label');row.className='step'+(st[id]?' done':'');row.htmlFor=id;
    row.innerHTML='<input type="checkbox" id="'+id+'"'+(st[id]?' checked':'')+'><span><b></b><small></small></span>';
    row.querySelector('b').textContent=t;row.querySelector('small').textContent=d;
    box.appendChild(row);
  }
}
document.addEventListener('change',e=>{
  if(e.target.matches('input[type=checkbox]')){st[e.target.id]=e.target.checked;e.target.closest('.step').classList.toggle('done',e.target.checked);save()}
});
document.getElementById('rs').onclick=()=>{st={};save();document.querySelectorAll('.step').forEach(r=>{r.classList.remove('done');r.querySelector('input').checked=false})};
</script>
</body>
</html>
